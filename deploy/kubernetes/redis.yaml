apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: traceatlas
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: ghcr.io/traceatlas/redis-sidecar:latest
          envFrom:
            - secretRef:
                name: traceatlas-env
