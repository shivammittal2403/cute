apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: traceatlas
  namespace: traceatlas
spec:
  rules:
    - host: traceatlas.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 3000
