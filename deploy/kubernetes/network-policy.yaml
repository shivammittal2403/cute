apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: traceatlas-egress-default-deny
  namespace: traceatlas
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
  # Connector egress allow-lists are enforced per-pod by traceatlas.security.egress
