apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: traceatlas
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/traceatlas/backend:latest
          envFrom:
            - secretRef:
                name: traceatlas-env
