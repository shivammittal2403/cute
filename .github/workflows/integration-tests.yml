name: integration-tests
on:
  push:
    branches: [main]
  pull_request: {}
jobs:
  integration_tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: docker compose up -d postgres redis minio
      - run: uv sync --all-extras
      - run: uv run pytest -m integration
