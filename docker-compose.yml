services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: traceatlas
      POSTGRES_USER: traceatlas
      POSTGRES_PASSWORD: traceatlas
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
  api:
    build: .
    env_file: .env
    depends_on: [postgres, redis, minio]
    ports: ["8000:8000"]
  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    env_file: .env
    depends_on: [postgres, redis, minio]

volumes:
  pgdata:
  miniodata:
